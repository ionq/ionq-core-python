repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Generated files (see .gitattributes) must stay byte-identical to raw
      # generator output for the generated.yml staleness check.
      - id: trailing-whitespace
        exclude: &generated ^(ionq_core/(api|models)/|ionq_core/(__init__|client|errors|types)\.py$|openapi\.json$)
      - id: end-of-file-fixer
        exclude: *generated
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
