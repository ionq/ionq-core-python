[project]
name = "ionq-core-python"
version = "0.1.0"
description = "Python client for the IonQ Cloud Platform API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.29",
    "attrs>=24.2",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ionq_core"]

[tool.ruff]
line-length = 120
target-version = "py312"
preview = true
extend-exclude = [
    "ionq_core/api",
    "ionq_core/models",
    "ionq_core/client.py",
    "ionq_core/errors.py",
    "ionq_core/types.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ionq_core"]

[tool.ty.environment]
python-version = "3.12"

[[tool.ty.overrides]]
include = ["ionq_core/models/**", "ionq_core/api/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
