[project]
name = "ionq-core"
version = "0.1.0"
description = "Python client for the IonQ Cloud Platform API"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "IonQ", email = "support@ionq.co"}]
keywords = ["ionq", "quantum", "quantum-computing", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "attrs>=24.2",
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://ionq.com"
Documentation = "https://docs.ionq.com"
Repository = "https://github.com/ionq/ionq-core-python"
Changelog = "https://github.com/ionq/ionq-core-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/ionq/ionq-core-python/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.35",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "ruff>=0.9",
    "ty",
    "pdoc>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ionq_core"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "ionq_core/api",
    "ionq_core/models",
    "ionq_core/client.py",
    "ionq_core/errors.py",
    "ionq_core/types.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["ionq_core"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]

[tool.ty.environment]
python-version = "3.12"

[[tool.ty.overrides]]
include = ["ionq_core/models/**", "ionq_core/api/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: marks tests that hit the real IonQ API (deselect with '-m \"not integration\"')",
]
addopts = "-m 'not integration' --tb=short --cov=ionq_core --cov-fail-under=90"

[tool.coverage.run]
omit = [
    "ionq_core/api/*",
    "ionq_core/models/*",
    "ionq_core/client.py",
    "ionq_core/errors.py",
    "ionq_core/types.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
]
