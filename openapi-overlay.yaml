overlay: 1.1.0
info:
  title: Fixes for openapi-python-client generation
  version: 1.1.0
extends: ./openapi.json
actions:
  - target: $.components.schemas.Optional_CircuitJobResult_
    description: >
      Add oneOf with explicit null type as replacement for allOf + nullable.
      The allOf + nullable pattern causes openapi-python-client to generate
      duplicate CircuitJobResultProbabilities models (issues #323, #1066, #1375).
      Remove this action when the generator fixes nullable allOf handling.
    update:
      oneOf:
        - type: "null"
        - $ref: "#/components/schemas/CircuitJobResult"
  - target: $.components.schemas.Optional_CircuitJobResult_.allOf
    description: Remove allOf (replaced by oneOf above).
    remove: true
  - target: $.components.schemas.Optional_CircuitJobResult_.nullable
    description: Remove nullable (represented by null type in oneOf above).
    remove: true
  - target: $.components.schemas.Backend.properties.backend.enum
    description: >
      Remove restrictive backend enum. The API returns backends (simulator,
      qpu.harmony) not listed in the spec enum. Use plain string instead.
      Remove when spec enums match reality.
    remove: true
  - target: $.components.schemas.Backend.properties.status.enum
    description: >
      Remove restrictive status enum. The API returns statuses (retired)
      not listed in the spec enum. Use plain string instead.
      Remove when spec enums match reality.
    remove: true
  - target: $.components.schemas.Characterization.properties.backend.enum
    description: >
      Remove restrictive characterization backend enum for same reason as above.
      Remove when spec enums match reality.
    remove: true
  - target: $.components.schemas.Job.required
    description: >
      Remove and replace required list to make shots optional.
      The API omits shots from list responses. Remove when spec fixes this.
    remove: true
  - target: $.components.schemas.Job
    update:
      required: [id, status, type, backend, dry_run, submitter_id, project_id, parent_job_id, session_id, metadata, name, submitted_at, started_at, completed_at, predicted_wait_time_ms, predicted_execution_duration_ms, execution_duration_ms, failure, output, settings, stats, results]
  - target: $.components.schemas.GetCircuitJobResponse.required
    description: Make shots optional on GetCircuitJobResponse (same reason as Job).
    remove: true
  - target: $.components.schemas.GetCircuitJobResponse
    update:
      required: [id, status, type, backend, dry_run, submitter_id, project_id, parent_job_id, session_id, metadata, name, submitted_at, started_at, completed_at, predicted_wait_time_ms, predicted_execution_duration_ms, execution_duration_ms, failure, output, child_job_ids, settings, stats, results]
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].required"
    description: Make shots optional on BaseJobSummary (same reason as Job).
    remove: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__']"
    update:
      required: [id, status, type, backend, dry_run, submitter_id, project_id, parent_job_id, session_id, metadata, name, submitted_at, started_at, completed_at, predicted_wait_time_ms, predicted_execution_duration_ms, execution_duration_ms, failure, output, settings, stats, results]
