overlay: 1.1.0
info:
  title: Fixes for openapi-python-client generation
  version: 1.1.0
extends: ./openapi.json
actions:
  - target: $.components.schemas.Optional_CircuitJobResult_
    description: >
      Add oneOf with explicit null type as replacement for allOf + nullable.
      The allOf + nullable pattern causes openapi-python-client to generate
      duplicate CircuitJobResultProbabilities models (issues #323, #1066, #1375).
      Remove this action when the generator fixes nullable allOf handling.
    update:
      oneOf:
        - type: "null"
        - $ref: "#/components/schemas/CircuitJobResult"
  - target: $.components.schemas.Optional_CircuitJobResult_.allOf
    description: Remove allOf (replaced by oneOf above).
    remove: true
  - target: $.components.schemas.Optional_CircuitJobResult_.nullable
    description: Remove nullable (represented by null type in oneOf above).
    remove: true
  - target: $.components.schemas.Backend.properties.backend.enum
    description: >
      Remove restrictive backend enum. The API returns backends (simulator,
      qpu.harmony) not listed in the spec enum. Use plain string instead.
      Remove when spec enums match reality.
    remove: true
  - target: $.components.schemas.Backend.properties.status.enum
    description: >
      Remove restrictive status enum. The API returns statuses (retired)
      not listed in the spec enum. Use plain string instead.
      Remove when spec enums match reality.
    remove: true
  - target: $.components.schemas.Characterization.properties.backend.enum
    description: >
      Remove restrictive characterization backend enum for same reason as above.
      Remove when spec enums match reality.
    remove: true
