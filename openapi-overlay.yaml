overlay: 1.0.0
info:
  title: ionq-core-python local OpenAPI fixes
  version: 0.2.0
  description: |
    Applied to openapi.json before client generation. Upstream marks QisCircuitInput.qubits
    optional, but the simulator preflight rejects payloads without it (surfacing as
    UnexpectedCompilationError), so require it locally.

actions:
  - target: $.components.schemas.QisCircuitInput.required
    remove: true
  - target: $.components.schemas.QisCircuitInput
    update:
      required:
        - circuit
        - gateset
        - qubits
