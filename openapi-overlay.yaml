overlay: 1.1.0
info:
  title: Spec fixes for IonQ API client generation
  version: 3.0.0
extends: ./openapi.json
actions:
  # Nullable schemas: these are always null when the value is absent.
  # Making the schema itself nullable is simpler than patching every property
  # that references it, and all current uses are in nullable contexts.
  - target: $.components.schemas.JsonObject
    update:
      nullable: true
  - target: $.components.schemas.Failure
    update:
      nullable: true
  - target: $.components.schemas.JobMetadata
    update:
      nullable: true

  # Backend.degraded: not returned by all backends (e.g. qpu.forte-enterprise-1
  # omits it). Remove from required so the field becomes optional.
  - target: $.components.schemas.Backend.required
    remove: true
  - target: $.components.schemas.Backend
    update:
      required: [backend, status, qubits, average_queue_time, last_updated]

  # CircuitJobSettings/CircuitJobStats cannot be made nullable at the schema
  # level because the generator creates duplicate model names. Instead we
  # remove the bare-$ref property and re-add it with allOf+nullable.
  - target: $.components.schemas.GetCircuitJobResponse.properties.settings
    remove: true
  - target: $.components.schemas.GetCircuitJobResponse.properties
    update:
      settings:
        allOf:
          - $ref: "#/components/schemas/CircuitJobSettings"
        nullable: true
  - target: $.components.schemas.GetCircuitJobResponse.properties.stats
    remove: true
  - target: $.components.schemas.GetCircuitJobResponse.properties
    update:
      stats:
        allOf:
          - $ref: "#/components/schemas/CircuitJobStats"
        nullable: true

  # Job: nullable primitive fields.
  # The API always returns these keys but sets them to null when not
  # applicable (e.g. started_at before the job starts).
  - target: $.components.schemas.Job.properties.project_id
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.parent_job_id
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.session_id
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.name
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.submitted_at
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.started_at
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.completed_at
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.predicted_wait_time_ms
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.predicted_execution_duration_ms
    update:
      nullable: true
  - target: $.components.schemas.Job.properties.execution_duration_ms
    update:
      nullable: true

  # BaseJobSummary (Pick_BaseJob...): same nullable primitives as Job.
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.project_id"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.parent_job_id"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.session_id"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.name"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.submitted_at"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.started_at"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.completed_at"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.predicted_wait_time_ms"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.predicted_execution_duration_ms"
    update:
      nullable: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.execution_duration_ms"
    update:
      nullable: true
