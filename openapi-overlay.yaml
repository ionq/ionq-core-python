overlay: 1.1.0
info:
  title: Spec fixes for IonQ API client generation
  version: 2.0.0
extends: ./openapi.json
actions:
  # Generator bug: nullable allOf pattern creates duplicate models.
  - target: $.components.schemas.Optional_CircuitJobResult_
    update:
      oneOf:
        - type: "null"
        - $ref: "#/components/schemas/CircuitJobResult"
  - target: $.components.schemas.Optional_CircuitJobResult_.allOf
    remove: true
  - target: $.components.schemas.Optional_CircuitJobResult_.nullable
    remove: true

  # Spec enums too restrictive (missing simulator, qpu.harmony, retired,
  # forte-enterprise-2/3).
  - target: $.components.schemas.Backend.properties.backend.enum
    remove: true
  - target: $.components.schemas.Backend.properties.status.enum
    remove: true
  - target: $.components.schemas.Characterization.properties.backend.enum
    remove: true
  - target: $.components.schemas.JobBackends.enum
    remove: true

  # Job fields: many are required+non-nullable but API returns null or omits them.
  # Make them optional.
  - target: $.components.schemas.Job.required
    remove: true
  - target: $.components.schemas.Job
    update:
      required: [id, status, type, backend, dry_run, submitter_id]
  - target: $.components.schemas.GetCircuitJobResponse.required
    remove: true
  - target: $.components.schemas.GetCircuitJobResponse
    update:
      required: [id, status, type, backend, dry_run, submitter_id]
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].required"
    remove: true
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__']"
    update:
      required: [id, status, type, backend, dry_run, submitter_id]

  # Job/BaseJob object fields: API returns null but spec has non-nullable $ref.
  - target: $.components.schemas.Job.properties.failure
    update:
      $ref: "#/components/schemas/Optional_Failure_"
  - target: $.components.schemas.Job.properties.metadata
    update:
      $ref: "#/components/schemas/Optional_JobMetadata_"
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.failure"
    update:
      $ref: "#/components/schemas/Optional_Failure_"
  - target: "$.components.schemas['Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__'].properties.metadata"
    update:
      $ref: "#/components/schemas/Optional_JobMetadata_"

  # JsonObject (used for output/settings/stats/results): API returns null.
  # Make the schema itself nullable since all uses can be null.
  - target: $.components.schemas.JsonObject
    update:
      nullable: true

  # Gate schemas: spec uses "type" but API expects "gate". Also missing
  # "target" (singular int), "control" (singular int), "rotation", "phase",
  # "phases" fields used in API examples.
  - target: $.components.schemas.Gate_QisGate_.properties
    update:
      gate:
        $ref: "#/components/schemas/QisGate"
      target:
        type: integer
        description: Single qubit target (alternative to targets array)
      control:
        type: integer
        description: Single control qubit (alternative to controls array)
      rotation:
        type: number
        format: double
        description: Rotation angle for rx/ry/rz gates
  - target: $.components.schemas.Gate_QisGate_.properties.type
    remove: true
  - target: $.components.schemas.Gate_QisGate_.required
    remove: true
  - target: $.components.schemas.Gate_QisGate_
    update:
      required: [gate]
  - target: $.components.schemas.Gate_NativeGate_.properties
    update:
      gate:
        $ref: "#/components/schemas/NativeGate"
      target:
        type: integer
        description: Single qubit target (alternative to targets array)
      phase:
        type: number
        format: double
        description: Phase for gpi/gpi2 gates
      phases:
        type: array
        items:
          type: number
          format: double
        description: Phases for ms gate
  - target: $.components.schemas.Gate_NativeGate_.properties.type
    remove: true
  - target: $.components.schemas.Gate_NativeGate_.required
    remove: true
  - target: $.components.schemas.Gate_NativeGate_
    update:
      required: [gate]

  # Results endpoints: API v0.4 returns results as URLs that must be
  # fetched separately.  The spec omits these endpoints entirely.
  - target: $.paths
    update:
      /jobs/{UUID}/results/probabilities:
        get:
          operationId: getJobProbabilities
          summary: Fetch the probability distribution for a completed job.
          tags: [default]
          parameters:
            - description: The UUID of the job.
              in: path
              name: UUID
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Probability distribution keyed by decimal qubit state.
              content:
                application/json:
                  schema:
                    type: object
                    additionalProperties:
                      type: number
            "404":
              description: Job not found or not yet completed.
          security:
            - apiKeyAuth: []
