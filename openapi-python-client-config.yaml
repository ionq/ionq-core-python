project_name_override: ionq-core
package_name_override: ionq_core
literal_enums: true

post_hooks:
  - "perl -pi -e 's/token: str\\K$/ = field(repr=False)/' client.py"
  - "YEAR=$(date +%Y) perl -0777 -pi -e 's/\\A(?!# SPDX-FileCopyrightText)/# SPDX-FileCopyrightText: $ENV{YEAR} IonQ, Inc.\\n# SPDX-License-Identifier: Apache-2.0\\n# \\@generated\\n\\n/' $(find . -name '*.py')"
  - "ruff check . --fix-only"
  - "ruff format ."
