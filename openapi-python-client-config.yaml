project_name_override: ionq-core
package_name_override: ionq_core
literal_enums: true

post_hooks:
  - "perl -pi -e 's/token: str\\K$/ = field(repr=False)/' client.py"
  - "perl -pi -e 'print \"# Copyright 2026 IonQ, Inc.\\n# SPDX-License-Identifier: Apache-2.0\\n\\n\" if !$s{$ARGV}++' $(find . -name '*.py')"
  - "ruff check . --fix-only"
  - "ruff format ."

class_overrides:
  Gate_QisGate:
    class_name: QisGateInstruction
    module_name: qis_gate_instruction
  Gate_NativeGate:
    class_name: NativeGateInstruction
    module_name: native_gate_instruction
