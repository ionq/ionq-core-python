project_name_override: ionq-core
package_name_override: ionq_core
package_version_override: "0.1.0"
literal_enums: true

post_hooks:
  - "python -Ic \"p=__import__('pathlib').Path('client.py');p.write_text(p.read_text().replace('    token: str\\n','    token: str = field(repr=False)\\n'))\""
  - "ruff check . --fix-only"
  - "ruff format ."

class_overrides:
  Gate_QisGate:
    class_name: QisGateInstruction
    module_name: qis_gate_instruction
  Gate_NativeGate:
    class_name: NativeGateInstruction
    module_name: native_gate_instruction
  Pick_BaseJob.Exclude_keyofBaseJob.child_job_ids__:
    class_name: BaseJobSummary
    module_name: base_job_summary
  Optional_string_:
    class_name: OptionalString
    module_name: optional_string
  Optional_IsoTimestamp_:
    class_name: OptionalIsoTimestamp
    module_name: optional_iso_timestamp
  Optional_number_:
    class_name: OptionalNumber
    module_name: optional_number
