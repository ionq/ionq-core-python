name: Feature Request
description: Suggest a feature for ionq-core
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/ionq/ionq-core-python/issues) first. For API surface changes (endpoints, parameters, response shapes), see [proposing changes](https://github.com/ionq/ionq-core-python/blob/main/CONTRIBUTING.md#proposing-changes).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What problem would this solve, and how would you like it to work?
    validations:
      required: true

  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
