name: Bug Report
description: Report a bug in ionq-core
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please search
        [existing issues](https://github.com/ionq/ionq-core-python/issues) first,
        and review the [reporting guide](https://github.com/ionq/ionq-core-python/blob/main/CONTRIBUTING.md#reporting-bugs)
        for what to include.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: |
        See [code structure](https://github.com/ionq/ionq-core-python/blob/main/CONTRIBUTING.md#code-structure)
        for the boundary between generated and hand-written code.
      options:
        - Generated client (regenerated from OpenAPI spec)
        - Hand-written extensions (retry, pagination, polling, sessions, native gates, etc.)
        - API surface / OpenAPI spec (originates upstream)
        - Documentation
        - Tests or tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including any error message or traceback.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce the bug.
      render: Python
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version Information
      description: |
        Paste the output of:
        ```bash
        python -c "import ionq_core, sys, platform; print(ionq_core.__version__, sys.version, platform.platform())"
        ```
      render: Text
    validations:
      required: true

  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
