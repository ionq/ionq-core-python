name: Bug Report
description: Report a bug in ionq-core
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/ionq/ionq-core-python/issues) before filing.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: |
        See [proposing changes](https://github.com/ionq/ionq-core-python/blob/main/CONTRIBUTING.md#proposing-changes) for the generated vs hand-written boundary.
      options:
        - Generated client (regenerated from OpenAPI spec)
        - Hand-written extensions (retry, pagination, polling, sessions, native gates, etc.)
        - API surface / OpenAPI spec (originates upstream)
        - Documentation
        - Tests or tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message or traceback.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Optional - skip if the error above already shows the problem.

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or steps to reproduce.
      render: Python
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Version Information
      description: |
        Paste the output of:
        ```bash
        python -c "import ionq_core, sys, platform; print(ionq_core.__version__, sys.version, platform.platform())"
        ```
      render: Text
    validations:
      required: true

  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submit checks
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
