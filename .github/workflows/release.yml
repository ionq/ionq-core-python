name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_FROZEN: true

jobs:
  verify-version:
    name: Verify release tag and package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Verify tag matches pyproject version and version is not already on PyPI
        run: |
          uv run --no-project python - <<'PY'
          import os
          import pathlib
          import tomllib
          import urllib.error
          import urllib.request

          tag = os.environ["GITHUB_REF_NAME"]  # e.g. v1.2.3
          if not tag.startswith("v"):
              raise SystemExit(f"Expected a tag starting with 'v', got: {tag}")

          tagged_version = tag[1:]

          pyproject_path = pathlib.Path("pyproject.toml")
          if not pyproject_path.exists():
              raise SystemExit("pyproject.toml not found")

          pyproject = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
          project = pyproject.get("project", {})

          project_name = project.get("name")
          project_version = project.get("version")
          dynamic_fields = set(project.get("dynamic", []))

          if not project_name:
              raise SystemExit("Missing [project].name in pyproject.toml")

          if "version" in dynamic_fields:
              raise SystemExit(
                  "This workflow expects a static [project].version in pyproject.toml. "
                  "Your project uses dynamic versioning, so this check should be changed "
                  "to inspect the built distribution metadata instead."
              )

          if not project_version:
              raise SystemExit("Missing [project].version in pyproject.toml")

          if project_version != tagged_version:
              raise SystemExit(
                  f"Tag version mismatch: tag is {tag}, but pyproject.toml has "
                  f"{project_version}. Expected tag v{project_version}."
              )

          pypi_url = f"https://pypi.org/pypi/{project_name}/{project_version}/json"
          try:
              with urllib.request.urlopen(pypi_url, timeout=10) as response:
                  if response.status == 200:
                      raise SystemExit(
                          f"Version already exists on PyPI: {project_name} {project_version}. "
                          "Bump the version before creating the release tag."
                      )
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          except urllib.error.URLError as exc:
              print(f"Could not reach PyPI to check for duplicates: {exc}")
              raise

          print(f"Project version validated, next releasing {project_name} {project_version}")
          PY

  test:
    name: Test Python ionq-core distribution (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - run: uv sync
      - run: uv run pytest

  build:
    name: Build Python ionq-core distribution
    needs: [verify-version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish Python ionq-core distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/ionq-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
