name: Spec drift check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned, never derived from openapi.json, so a tampered spec cannot redirect this
      # check. tests/test_docs_consistency.py keeps it aligned with DEFAULT_BASE_URL.
      SPEC_URL: https://api.ionq.co/v0.4/api-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch latest spec
        run: curl -sf "$SPEC_URL" -o /tmp/latest-spec.json
      - name: Check for drift
        id: drift
        run: |
          norm() { jq -S 'del(.info.description)' "$1"; }
          if ! diff -u --label vendored --label upstream <(norm openapi.json) <(norm /tmp/latest-spec.json) > /tmp/spec.diff; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The spec at ${SPEC_URL} has diverged from the vendored openapi.json. Fetch the new spec and regenerate the client."
            printf '\n<details><summary>Diff (sorted, pretty-printed JSON)</summary>\n\n```diff\n'
            head -c 60000 /tmp/spec.diff
            [[ $(wc -c < /tmp/spec.diff) -gt 60000 ]] && printf '\n... (truncated)\n'
            printf '```\n</details>\n'
          } > /tmp/body.md
          existing=$(gh issue list --label spec-drift --state open --json number --jq '.[0].number // empty')
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "OpenAPI spec has changed upstream" \
              --body-file /tmp/body.md \
              --label spec-drift
          else
            gh issue edit "$existing" --body-file /tmp/body.md
          fi
